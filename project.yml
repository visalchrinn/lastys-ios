name: Lastys
options:
  bundleIdPrefix: com.lastys
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: km
  createIntermediateGroups: true

packages:
  LastysCore:
    path: LastysCore

targets:
  Lastys:
    type: application
    platform: iOS
    sources:
      - path: Lastys
    dependencies:
      - package: LastysCore
    info:
      path: Lastys/Info.plist
      properties:
        CFBundleDevelopmentRegion: km
        CFBundleLocalizations:
          - km
          - en
        CFBundleDisplayName: Lastys
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - PlusJakartaSans.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Lastys uses the camera to Scan Lastys QR codes.
        NSFaceIDUsageDescription: Lastys asks for Face ID before showing or changing your Recovery code.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lastys.app
        PRODUCT_NAME: Lastys
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Lastys:
    build:
      targets:
        Lastys: all
    run:
      config: Debug
    archive:
      config: Release
