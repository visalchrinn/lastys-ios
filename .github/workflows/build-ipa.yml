name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Lastys.xcodeproj \
            -scheme Lastys \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Lastys.app Payload/
          zip -qry Lastys.ipa Payload
          ls -la Lastys.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lastys-ipa
          path: Lastys.ipa

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Lastys.ipa \
            --title "Lastys build ${{ github.run_number }}" \
            --notes "Unsigned IPA built from ${{ github.sha }}. Sign it (Sideloadly, AltStore, or your Apple Developer certificate) before installing on a device."
